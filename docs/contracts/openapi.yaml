openapi: 3.1.0
info:
  title: Anuvritti API
  version: 0.3.0
  description: >
    Family presence, intent & memory platform. Scope frozen to PRD §48.
    Every AI-derived field is returned with provenance (PRD §13, §42, ADR-0005).


    **Authentication (TASK-511, HARDENING §5.1).** Every operation requires a device
    bearer token except `POST /families` and `POST /pairing/claim`, which exist to
    obtain one. The token *is* the family and the member: no request may name another
    family, and any id in a body or query that disagrees with the token is a 403 rather
    than a silently redirected write. Clients should simply omit those ids.


    **Time is a phrase, never a count (TASK-507).** `Spark.saved` and
    `Suggestion.elapsed` carry the elapsed time already worded ("8 months ago"). The
    exact number of days is not on the wire anywhere, so no interface can render one.


    **Idempotent capture (TASK-509).** Every capture endpoint accepts an
    `Idempotency-Key`, so a phone replaying an offline queue cannot create duplicates.
servers: [{ url: /v1 }]

security: [{ deviceToken: [] }]

paths:
  /health: { get: { summary: Liveness, responses: { "200": { description: ok } } } }
  /ready:  { get: { summary: Readiness (checks store + media), responses: { "200": { description: ready }, "503": { description: not ready } } } }
  /metrics: { get: { summary: Prometheus text exposition, responses: { "200": { description: ok } } } }

  /families:
    post:
      summary: Bootstrap — create the family and pair the device that created it
      operationId: bootstrapFamily
      description: >
        The founding device is paired by this act rather than by a second call: a window
        between "the family exists" and "the family is protected" is a window someone else
        can walk through. The returned token is shown exactly once.


        On a production box this closes after the first family (409). Second families
        arrive in TASK-901 with real accounts.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateFamily" } } } }
      responses:
        "201": { description: created and paired, content: { application/json: { schema: { $ref: "#/components/schemas/Bootstrap" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /pairing/codes:
    post:
      summary: Show a pairing code on a device that is already trusted
      operationId: openPairing
      description: Eight Crockford characters, single use, ten minutes, attempt-limited.
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/PairingCode" } } } } }

  /pairing/claim:
    post:
      summary: Turn a typed pairing code into a paired device
      operationId: claimPairing
      description: >
        Wrong, malformed, expired, already-claimed and locked-out all answer identically
        with `PAIRING_FAILED`. Telling them apart tells a caller which codes exist.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimPairing" } } } }
      responses:
        "201": { description: paired, content: { application/json: { schema: { $ref: "#/components/schemas/Claimed" } } } }
        "401": { $ref: "#/components/responses/Error" }

  /devices:
    get:
      summary: What is paired, so a parent can decide what to revoke
      operationId: listDevices
      responses: { "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } } }

  /devices/{device_id}:
    delete:
      summary: Cut a lost phone off
      operationId: revokeDevice
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /families/{family_id}/children:
    post:
      summary: Add a child profile
      operationId: addChild
      parameters: [{ $ref: "#/components/parameters/FamilyId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateChild" } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Child" } } } } }

  /sparks:
    post:
      summary: Universal Capture (PRD §11, §48 F1) — target < 10s, no long form
      operationId: captureSpark
      description: Accepts url | text | screenshot | photo | voice. AI enrichment runs inline.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CaptureSpark" } } } }
      responses:
        "201": { description: "Saved ✨", content: { application/json: { schema: { $ref: "#/components/schemas/Spark" } } } }
        "422": { $ref: "#/components/responses/Error" }
    get:
      summary: Safe Vault search (PRD §48 F5) — natural-ish queries, no folders
      operationId: searchSparks
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "e.g. 'toys I saved', 'things about space'" }
        - { name: intent, in: query, schema: { $ref: "#/components/schemas/IntentType" } }
        - { name: child_id, in: query, schema: { type: string } }
        - { name: age, in: query, schema: { type: integer }, description: Sparks whose age range contains this age }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SparkStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
      responses: { "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Spark" } } } } } }

  /sparks/{spark_id}:
    get:
      summary: One Spark
      operationId: getSpark
      parameters: [{ $ref: "#/components/parameters/SparkId" }]
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Spark" } } } }, "404": { $ref: "#/components/responses/Error" } }

  /sparks/{spark_id}/why:
    post:
      summary: Optional human "Why" (PRD §12, §48 F3) — always skippable
      operationId: recordWhy
      parameters: [{ $ref: "#/components/parameters/SparkId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecordWhy" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Spark" } } } } }

  /sparks/{spark_id}/override:
    post:
      summary: Human correction of an AI field. The human always wins (PRD §13).
      operationId: overrideField
      parameters: [{ $ref: "#/components/parameters/SparkId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OverrideField" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Spark" } } } } }

  /sparks/{spark_id}/done:
    post:
      summary: '"Did this happen?" → Spark becomes a Moment (PRD §15, §48 F7)'
      operationId: markAsDone
      description: Every attachment is optional. "Nothing" is a valid answer — no journaling burden.
      parameters:
        - { $ref: "#/components/parameters/SparkId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarkAsDone" } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Moment" } } } }, "409": { $ref: "#/components/responses/Error" } }

  /return/worth-bringing-back:
    get:
      summary: Worth Bringing Back (PRD §14, §48 F6)
      operationId: worthBringingBack
      description: >
        Returns at most `max_suggestions_per_day` items. An empty list is normal and silent.
        Payload contains no urgency, no counters, no guilt (PRD §8.5, enforced by test).
      parameters:
        - { name: child_id, in: query, schema: { type: string } }
      responses: { "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Suggestion" } } } } } }

  /return/{spark_id}/respond:
    post:
      summary: Maybe later / Let's do it / Not relevant anymore
      operationId: respondToSuggestion
      parameters: [{ $ref: "#/components/parameters/SparkId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SuggestionResponse" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Spark" } } } } }

  /little-things:
    post:
      summary: Little Things — one-tap capture, no structure (PRD §17, §48 F8)
      operationId: captureLittleThing
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CaptureLittleThing" } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/LittleThing" } } } } }

  /right-now:
    get:
      summary: Get today's Right Now prompt (PRD §18, §48 F9)
      operationId: todaysPrompt
      responses: { "200": { description: ok, content: { application/json: { schema: { type: object, properties: { prompt: { type: string } } } } } } }
    post:
      summary: Answer a Right Now prompt
      operationId: captureRightNow
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CaptureRightNow" } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/RightNow" } } } } }

  /voice:
    post:
      summary: Keep a recording (PRD §12, §17, §24)
      operationId: keepVoiceNote
      description: >
        The bytes are already at `POST /media`; this says how long they are and what, if
        anything, the handset's own recogniser made of them. There is no minimum duration
        and there never will be — PRD §24 says nothing is rejected for being unpolished,
        and a validator with a floor in it is that promise quietly undone.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/KeepVoiceNote" } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/VoiceNote" } } } }, "404": { $ref: "#/components/responses/Error" }, "415": { $ref: "#/components/responses/Error" } }
    get:
      summary: The Papa Voice Vault — every recording, newest first (PRD §21)
      operationId: listVoiceNotes
      description: >
        No total, no unheard count and no cursor. This is a shelf, and a shelf does not
        tell you how far behind you are (PRD §8.5).
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Vault" } } } } }

  /voice/{media_id}:
    get:
      summary: One recording and whatever is known about what is in it
      operationId: getVoiceNote
      parameters: [{ $ref: "#/components/parameters/MediaId" }]
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/VoiceNote" } } } }, "404": { $ref: "#/components/responses/Error" } }

  /voice/{media_id}/transcript:
    post:
      summary: Correct what the machine misheard (PRD §8.7)
      operationId: correctTranscript
      description: >
        The only way to produce a `HUMAN` transcript. Permanent — no later run of a better
        model overrides it — and it never touches the audio.
      parameters: [{ $ref: "#/components/parameters/MediaId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CorrectTranscript" } } } }
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/VoiceNote" } } } }, "404": { $ref: "#/components/responses/Error" } }

  /film/compile:
    post:
      summary: Assemble this year's film shelf from what the family actually kept
      operationId: compileFilm
      description: >
        Returns the evidence in capture order. `rendered_media_id` is null until the
        provenance-verified renderer has deposited an MP4 in the family archive; null is
        an honest not-yet, never a progress state.
      responses:
        "200": { description: compiled, content: { application/json: { schema: { $ref: "#/components/schemas/FilmCompilation" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /media:
    post:
      summary: Upload media (encrypted at rest, PRD §44)
      operationId: uploadMedia
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { family_id: { type: string }, kind: { type: string }, file: { type: string, format: binary } } } } } }
      responses: { "201": { description: created, content: { application/json: { schema: { $ref: "#/components/schemas/Media" } } } }, "413": { $ref: "#/components/responses/Error" }, "415": { $ref: "#/components/responses/Error" } }

  /media/{media_id}:
    get:
      summary: Download media
      operationId: downloadMedia
      description: >
        Decrypted on the way out and never cached (`Cache-Control: private, no-store`).
        Media belonging to another family answers `MEDIA_NOT_FOUND` — the same answer an id
        that never existed gets, so the response cannot be used to discover a stranger's
        photograph is there.
      parameters: [{ name: media_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: the bytes, content: { "*/*": { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }

  /families/{family_id}/export:
    get:
      summary: Export everything (PRD §44 — non-negotiable)
      operationId: exportFamily
      parameters: [{ $ref: "#/components/parameters/FamilyId" }]
      responses: { "200": { description: complete archive, content: { application/json: { schema: { $ref: "#/components/schemas/FamilyExport" } } } } }

  /families/{family_id}:
    get:
      summary: The family, its members and its children
      operationId: getFamily
      parameters: [{ $ref: "#/components/parameters/FamilyId" }]
      responses: { "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Family" } } } } }
    delete:
      summary: Delete everything, including media bytes (PRD §44)
      operationId: deleteFamily
      parameters: [{ $ref: "#/components/parameters/FamilyId" }]
      responses: { "200": { description: deleted, content: { application/json: { schema: { type: object, additionalProperties: { type: integer } } } } } }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: >
        A device token from bootstrap or pairing. Opaque, 256 bits, prefixed `anv_`.
        Only its SHA-256 fingerprint is stored server-side.
  parameters:
    FamilyId: { name: family_id, in: path, required: true, schema: { type: string } }
    SparkId:  { name: spark_id,  in: path, required: true, schema: { type: string } }
    MediaId:  { name: media_id,  in: path, required: true, schema: { type: string } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: >
        Replay protection. The same key with the same body returns the first response
        verbatim; the same key with a different body is a 409. Rejected requests are not
        pinned to their key, so a corrected retry can reuse it.
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }

    IntentType:
      type: string
      description: V0 ships six (PRD §48 F4). Others exist in the model but are gated off.
      enum: [DO, BUY, WATCH, READ, TEACH, REMEMBER]

    SparkStatus:
      type: string
      enum: [CAPTURED, WAITING, RELEVANT, SUGGESTED, PLANNED, EXPERIENCED, REMEMBERED, ARCHIVED]

    SourceKind:
      type: string
      enum: [URL, TEXT, SCREENSHOT, PHOTO, VOICE]

    Visibility:
      type: string
      enum: [PRIVATE, FAMILY, CHILD_VISIBLE]

    Attributed:
      type: object
      description: PRD §13/§42 — every AI-derived field carries its provenance.
      required: [value, source, confidence, human_override]
      properties:
        value: {}
        source: { type: string, enum: [HUMAN, AI, DEFAULT] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        human_override: { type: boolean }

    AgeRange:
      type: object
      required: [min_years, max_years]
      properties: { min_years: { type: integer }, max_years: { type: integer } }

    Device:
      type: object
      description: >
        A paired device as a parent deciding what to revoke would need to see it. No token,
        no fingerprint, no request count. `last_seen_at` is the only usage fact kept.
      required: [id, display_name, created_at, last_seen_at, revoked]
      properties:
        id: { type: string }
        display_name: { type: string, example: "the old iPad" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }
        revoked: { type: boolean }

    IssuedDevice:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            token:
              type: string
              example: "anv_..."
              description: >
                The one moment this exists in plaintext. It is never returned again — store
                it in the platform keychain and treat losing it as needing to pair again.

    Bootstrap:
      type: object
      description: The family, and the token for the device that just created it.
      required: [id, name, members, children, device]
      properties:
        id: { type: string }
        name: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        children: { type: array, items: { $ref: "#/components/schemas/Child" } }
        device: { $ref: "#/components/schemas/IssuedDevice" }

    PairingCode:
      type: object
      required: [code, expires_in_seconds]
      properties:
        code: { type: string, example: "K7QM-2X9B", description: Shown, never stored in this form }
        expires_in_seconds: { type: integer, example: 600 }

    ClaimPairing:
      type: object
      required: [code, device_name]
      properties:
        code:
          type: string
          maxLength: 200
          description: >
            As typed. Case, spaces and dashes are forgiven, and O/I/L are read as 0/1/1.
            Deliberately has no minimum length: a 422 for an empty code and a 401 for a
            wrong one are two different answers, and the difference is a hint.
        device_name: { type: string, maxLength: 60, example: "Mum's phone" }

    Claimed:
      type: object
      required: [device, family]
      properties:
        device: { $ref: "#/components/schemas/IssuedDevice" }
        family: { $ref: "#/components/schemas/Family" }

    CreateFamily:
      type: object
      required: [name, owner_display_name]
      properties: { name: { type: string }, owner_display_name: { type: string } }

    Family:
      type: object
      required: [id, name, members, children]
      properties:
        id: { type: string }
        name: { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
        children: { type: array, items: { $ref: "#/components/schemas/Child" } }

    Member:
      type: object
      required: [id, display_name, role]
      properties:
        id: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [PARENT, CO_PARENT, CHILD, GRANDPARENT] }

    CreateChild:
      type: object
      required: [display_name, date_of_birth]
      properties: { display_name: { type: string }, date_of_birth: { type: string, format: date } }

    Child:
      type: object
      required: [id, display_name, date_of_birth, age_years]
      properties:
        id: { type: string }
        display_name: { type: string }
        date_of_birth: { type: string, format: date }
        age_years: { type: integer }

    CaptureSpark:
      type: object
      required: [source]
      description: >
        `family_id` and `owner_id` are optional and should be omitted: the token already
        says who this is. They are still *accepted*, and a value that disagrees with the
        token is a 403 rather than a silently redirected write, so a client with a stale id
        finds out rather than writing into the right family by luck.
      properties:
        family_id: { type: string, nullable: true }
        owner_id: { type: string, nullable: true }
        subject_child_id: { type: string, nullable: true }
        source:
          type: object
          required: [kind]
          properties:
            kind: { $ref: "#/components/schemas/SourceKind" }
            url: { type: string, nullable: true }
            text: { type: string, nullable: true }
            creator: { type: string, nullable: true }
            title: { type: string, nullable: true }
            media_id: { type: string, nullable: true }
        note: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/Visibility" }

    Spark:
      type: object
      required: [id, family_id, owner_id, title, source, intent, category, tags, status, visibility, saved, created_at]
      properties:
        id: { type: string }
        family_id: { type: string }
        owner_id: { type: string }
        subject_child_id: { type: string, nullable: true }
        title: { type: string }
        note: { type: string, nullable: true }
        source:
          type: object
          description: PRD §43 — a Spark keeps its meaning even if the link dies.
          properties:
            kind: { $ref: "#/components/schemas/SourceKind" }
            url: { type: string, nullable: true }
            creator: { type: string, nullable: true }
            title: { type: string, nullable: true }
            media_id: { type: string, nullable: true }
        intent: { $ref: "#/components/schemas/Attributed" }
        age_range: { $ref: "#/components/schemas/Attributed" }
        category: { $ref: "#/components/schemas/Attributed" }
        tags: { type: array, items: { type: string } }
        why:
          type: object
          nullable: true
          description: >
            PRD §12. `voice` rides inside the why rather than beside it, because that is
            the relationship: the recording is the answer and the text is a second, lesser
            way of giving it.
          properties:
            text: { type: string, nullable: true }
            voice_media_id: { type: string, nullable: true }
            voice: { $ref: "#/components/schemas/VoiceNote" }
            recorded_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/SparkStatus" }
        visibility: { $ref: "#/components/schemas/Visibility" }
        saved:
          type: string
          x-anuvritti-brand: Elapsed
          example: "8 months ago"
          description: >
            How long ago this was saved, already worded (PRD §8.5, TASK-507). The server
            does the arithmetic so no interface is ever handed the number.
        created_at:
          type: string
          format: date-time
          description: >
            For ordering and for the export. Not for display — `saved` is the display form.

    RecordWhy:
      type: object
      description: At least one of text / voice_media_id. Voice preferred (PRD §12).
      properties: { text: { type: string, nullable: true }, voice_media_id: { type: string, nullable: true } }

    OverrideField:
      type: object
      required: [field, value]
      properties:
        field: { type: string, enum: [intent, age_range, category] }
        value: {}

    Suggestion:
      type: object
      description: >
        PRD §14/§48 F6. Contains no urgency, no counts, no streaks. `reason` is warm
        and factual; `actions` are exactly the three the PRD names.
      required: [spark, reason, elapsed, actions]
      properties:
        spark: { $ref: "#/components/schemas/Spark" }
        reason: { type: string, example: "You saved this 8 months ago. He may be ready now." }
        elapsed:
          type: string
          x-anuvritti-brand: Elapsed
          example: "8 months ago"
          description: >
            Replaces `days_since_capture`, removed in TASK-507. It was the one field on the
            whole wire that handed an interface a number about a family's own life, and
            every interesting misuse of this product starts with rendering it.
        actions: { type: array, items: { type: string, enum: [maybe_later, lets_do_it, not_relevant_anymore] } }

    SuggestionResponse:
      type: object
      required: [response]
      properties:
        response: { type: string, enum: [maybe_later, lets_do_it, not_relevant_anymore] }

    MarkAsDone:
      type: object
      description: All fields optional — "nothing" is a valid answer (PRD §15).
      properties:
        happened_on: { type: string, format: date, nullable: true }
        reflection: { type: string, nullable: true }
        photo_media_id: { type: string, nullable: true }
        audio_media_id: { type: string, nullable: true }

    Moment:
      type: object
      required: [id, spark_id, happened_on, created_at]
      properties:
        id: { type: string }
        spark_id: { type: string }
        happened_on: { type: string, format: date }
        reflection: { type: string, nullable: true }
        photo_media_id: { type: string, nullable: true }
        audio_media_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CaptureLittleThing:
      type: object
      properties:
        family_id: { type: string, nullable: true }
        author_id: { type: string, nullable: true }
        subject_child_id: { type: string, nullable: true }
        text: { type: string, nullable: true }
        audio_media_id: { type: string, nullable: true }

    LittleThing:
      type: object
      description: >
        PRD §17. `voice` comes before `text` on purpose: the recording is the artifact and
        the words are a lesser way of giving the same answer (TASK-602).
      required: [id, created_at]
      properties:
        id: { type: string }
        voice: { $ref: "#/components/schemas/VoiceNote" }
        audio_media_id: { type: string, nullable: true }
        text: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Transcript:
      type: object
      description: >
        PRD §8.7. Words that stand in for a recording in a search box, and nowhere else.
        `source` is never `DEFAULT`: a transcript is either a machine's reading or a
        person's statement, and the object exists so a client cannot render the words
        without the provenance sitting beside them.
      required: [text, source, confidence, engine, made_at]
      properties:
        text: { type: string }
        source: { type: string, enum: [AI, HUMAN] }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: >
            Strictly below 1.0 for a machine reading, exactly 1.0 for a human one.
            Certainty belongs to the person who was in the room.
        engine:
          type: string
          example: device-speech
          description: Who said so. `hand` when a person typed it.
        made_at: { type: string, format: date-time }

    VoiceNote:
      type: object
      description: >
        A recording that was kept (PRD §12, §17, §21). Identified by its media id, because
        the recording *is* the record — there is no shape here that can describe a
        transcript whose audio has gone.
      required: [media_id, duration_seconds, recorded_at]
      properties:
        media_id: { type: string }
        duration_seconds:
          type: number
          description: >
            Measured, not described. The one number on this wire that is a property of the
            artifact rather than a fact about a family, the way a photograph has
            dimensions — TASK-707 cuts a film against it.
        recorded_at: { type: string, format: date-time }
        transcript: { $ref: "#/components/schemas/Transcript" }

    Vault:
      type: object
      description: PRD §21. Deliberately has no count field of any kind.
      required: [recordings]
      properties:
        recordings: { type: array, items: { $ref: "#/components/schemas/VoiceNote" } }

    FilmMaterial:
      type: object
      required: [kind, captured_at]
      description: One real source for the annual film; exactly one payload is present.
      properties:
        kind: { type: string, enum: [RECORDING, SPARK] }
        captured_at: { type: string, format: date-time }
        recording: { $ref: "#/components/schemas/VoiceNote" }
        spark: { $ref: "#/components/schemas/Spark" }

    FilmCompilation:
      type: object
      required: [child_name, year, materials]
      description: >
        The phone's truthful view of this year's film. Deliberately no scene count,
        duration, completion, percentage or target.
      properties:
        child_name: { type: string }
        year: { type: integer }
        materials: { type: array, items: { $ref: "#/components/schemas/FilmMaterial" } }
        rendered_media_id: { type: string, nullable: true }

    KeepVoiceNote:
      type: object
      required: [media_id, duration_seconds]
      properties:
        family_id: { type: string, nullable: true }
        author_id: { type: string, nullable: true }
        media_id: { type: string }
        duration_seconds:
          type: number
          description: >
            No minimum, deliberately. A half-second clip of someone starting to say
            something and giving up is a real thing that happened (PRD §24).
        heard_text:
          type: string
          nullable: true
          description: >
            What the handset's own recogniser made of it. Stored with `AI` provenance
            whatever the phone believes about itself.
        heard_confidence: { type: number, minimum: 0, maximum: 1, nullable: true }

    CorrectTranscript:
      type: object
      required: [text]
      properties:
        text: { type: string }

    CaptureRightNow:
      type: object
      required: [child_id, answer]
      properties:
        family_id: { type: string, nullable: true }
        child_id: { type: string }
        prompt: { type: string }
        answer: { type: string }

    RightNow:
      type: object
      required: [id, child_id, prompt, answer, captured_at]
      properties:
        id: { type: string }
        child_id: { type: string }
        prompt: { type: string }
        answer: { type: string }
        captured_at: { type: string, format: date-time }

    Media:
      type: object
      required: [id, kind, mime_type, byte_size, encrypted]
      properties:
        id: { type: string }
        kind: { type: string }
        mime_type: { type: string }
        byte_size: { type: integer }
        encrypted: { type: boolean }

    FamilyExport:
      type: object
      description: PRD §44 — export everything, in a form the family can actually read.
      properties:
        exported_at: { type: string, format: date-time }
        family: { $ref: "#/components/schemas/Family" }
        sparks: { type: array, items: { $ref: "#/components/schemas/Spark" } }
        moments: { type: array, items: { $ref: "#/components/schemas/Moment" } }
        little_things: { type: array, items: { $ref: "#/components/schemas/LittleThing" } }
        right_now: { type: array, items: { $ref: "#/components/schemas/RightNow" } }
        media_manifest: { type: array, items: { $ref: "#/components/schemas/Media" } }
